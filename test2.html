<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة تجريبية 2</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f3460;
            color: #eee;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 40px;
            border: 2px solid #e94560;
            border-radius: 16px;
            background-color: #533483;
        }
        h1 { color: #e94560; }
        ul { list-style: none; padding: 0; font-size: 1.1rem; line-height: 2; }
    </style>
</head>
<body>
    <div class="container">
        <h1>أوامر Git الأساسية 🚀</h1>
        <ul>
            <li>git init</li>
            <li>git add .</li>
            <li>git commit -m "message"</li>
            <li>git push</li>
            <li>git pull</li>
        </ul>
    </div>
</body>
</html>
